<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarek Abdel Hamid</title>
<meta name="description" content="Tarek Abdel Hamid — Traductor Público Matriculado Árabe / Español (Mat. N° 1173), Asunción, Paraguay. Traducción certificada, interpretación, obras traducidas y programación.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Tarek Abdel Hamid — Traductor Público Árabe / Español">
<meta property="og:description" content="Traducción certificada, interpretación, obras traducidas y programación. Asunción, Paraguay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: sobrio, elegante, seguro — un profesional con firma y matrícula
   IDEA: el sello del traductor público, disco grafito con aro dorado (lenguaje del logo de AHLAN), con su firma caligráfica
   PICTURE: sello grande con el logo «طارق», girando el texto del aro, delante del original árabe y la traducción
   COLOUR and TYPE: grafito #17191d, gris #24272d, oro #c9a24a; Sora + Inter, Noto Kufi Arabic, Amiri para títulos árabes de libros
   LAYOUT: portada, bandas alternadas, estantería de libros, línea de tiempo, contacto al pie */
:root{color-scheme:dark;--bg:#17191d;--bg2:#202328;--card:#272a30;--line:#363a42;--ink:#eceae4;--mute:#a7a59f;--gold:#c9a24a;--gold2:#e6c878;
--fh:"Sora",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
:root[lang=ar]{--fh:"Noto Kufi Arabic","Sora",sans-serif;--fb:"Noto Kufi Arabic","Inter",sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb);overflow-x:clip}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(40px,6vw,88px) max(5vw,16px)}
.alt{background:var(--bg2);border-block:1px solid var(--line)}
h1,h2,h3{font-family:var(--fh);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(34px,5vw,52px);font-weight:700}
h2{font-size:clamp(28px,3.4vw,40px);font-weight:700;margin-block-end:14px}
h3{font-size:19px;font-weight:600}
p{margin:0}
.lead{color:var(--mute);font-size:17px;max-width:66ch}

header{position:sticky;top:0;z-index:5;background:rgba(23,25,29,.9);backdrop-filter:blur(8px);border-block-end:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fh);font-weight:600;margin-inline-end:auto}
.mini{width:36px;height:36px;border-radius:50%;background:#2b2e34;border:2px solid var(--gold);display:grid;place-items:center;overflow:hidden}
.mini img{width:70%;height:70%;object-fit:contain}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--mute);padding:10px 9px;border-radius:8px;font-size:14.5px}
nav a:hover{color:var(--ink);background:var(--card)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{all:unset;cursor:pointer;min-width:44px;height:38px;display:grid;place-items:center;font:600 13px var(--fb);color:var(--mute)}
.langs button[aria-pressed=true]{background:var(--gold);color:#17191d}
.langs button:focus-visible,.btn:focus-visible,nav a:focus-visible,.lnk:focus-visible,a.cbox:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;min-height:min(calc(100vh - 60px),720px)}
.role{color:var(--gold);font-weight:600;font-size:15px;margin-block-end:16px}
.hero h1 + p{margin-block:20px 30px}
.ar-name{font:600 22px "Noto Kufi Arabic",sans-serif;color:var(--mute);margin-block-start:10px;display:block}
:root[lang=ar] .ar-name{display:none}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px}
.btn.g{background:var(--gold);color:#17191d}.btn.g:hover{background:var(--gold2)}
.btn.o{border:1px solid var(--line);color:var(--ink)}.btn.o:hover{border-color:var(--gold)}
.art{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;justify-self:center}
.art svg{width:100%;height:100%;display:block}
.spin{transform-origin:300px 300px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}html{scroll-behavior:auto}}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);margin-block-start:36px}
.docs{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.docs li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.docs li::before{content:"";flex:none;width:9px;height:9px;margin-block-start:7px;border-radius:50%;border:2px solid var(--gold)}
.steps{display:grid;gap:14px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font:700 18px var(--fh);color:var(--gold2)}
.steps p{color:var(--mute);font-size:15px;margin-block-start:4px}
.note{margin-block-start:22px;padding:16px 18px;border-inline-start:3px solid var(--gold);background:var(--card);border-radius:0 10px 10px 0;font-size:15px}
:root[dir=rtl] .note{border-radius:10px 0 0 10px}

/* interpretación */
.bridge{display:grid;grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr);gap:24px;align-items:center;margin-block-start:36px}
.pillar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.pillar p{color:var(--mute);font-size:15px;margin-block-start:8px}
.pillar .k{font:700 13px var(--fb);color:var(--gold);margin-block-end:8px;display:block}
.rings{text-align:center}
.rings svg{width:100%;max-width:220px;height:auto}
.rings span{display:block;font:600 15px var(--fh);color:var(--gold2);margin-block-start:6px}

/* obras */
.shelf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-block-start:36px}
.book{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.cover{aspect-ratio:2/3;border-radius:3px 8px 8px 3px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;position:relative;box-shadow:0 14px 26px rgba(0,0,0,.45),inset 6px 0 0 rgba(0,0,0,.25)}
.cover::after{content:"";position:absolute;inset:10px;border:1px solid rgba(230,200,120,.5);border-radius:3px}
.cover .ca{font:700 26px/1.3 "Amiri","Noto Kufi Arabic",serif;color:#fff;direction:rtl}
.cover .cr{width:40px;height:2px;background:var(--gold2)}
.cover .ce{font:600 12px/1.3 "Sora",sans-serif;color:#f2ead6}
.cover .cn{font:500 11px "Inter",sans-serif;color:#d9cfb6}
.cover.photo{aspect-ratio:auto;padding:0;width:100%;height:auto;display:block;object-fit:cover}
.c1{background:linear-gradient(160deg,#3b4a5c,#1f2833)}
.c2{background:linear-gradient(160deg,#5a3a2a,#2a1b14)}
.binfo h3{font-size:21px}
.binfo .bar2{font:600 20px "Noto Kufi Arabic",sans-serif;color:var(--gold2);margin-block:4px 2px}
.binfo .au{color:var(--ink);font-weight:500}
.binfo .ed,.binfo .meta{color:var(--mute);font-size:14.5px;margin-block-start:6px}
.binfo .bn{font-size:15px;margin-block-start:12px;color:var(--ink)}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin-block-start:14px}
.lnk{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:14px;color:var(--gold2)}
.lnk:hover{border-color:var(--gold)}
.loc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:18px;align-items:center;margin-block-start:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.loc svg{width:52px;height:52px}.loc .k{display:block;font:700 13px var(--fb);color:var(--gold);margin-block-end:4px}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-block-start:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.card .ic{width:52px;height:52px}
.card p{color:var(--mute);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:auto;padding-block-start:6px}
.tags span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}

/* trayectoria */
.tl{list-style:none;margin:36px 0 0;padding:0;position:relative;max-width:860px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:118px;width:2px;background:linear-gradient(var(--gold),rgba(201,162,74,.2))}
.tl li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:40px;padding-block:12px;position:relative}
.tl li::after{content:"";position:absolute;inset-inline-start:112px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--bg2);border:3px solid var(--gold)}
.tl .y{font:700 16px var(--fh);color:var(--gold2);text-align:right;white-space:nowrap;padding-block-start:2px}
.tl .t{font-size:16px}
:root[dir=rtl] .tl .y{text-align:left}
.tl .t small{display:block;color:var(--mute);font-size:14.5px}

.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-block-start:32px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
a.cbox:hover{border-color:var(--gold)}
.cbox small{color:var(--gold);font-weight:600;font-size:13px}
.cbox span,.cbox a{font-size:16.5px;overflow-wrap:anywhere}
.cbox a{text-decoration:none}.cbox a:hover{color:var(--gold2)}
.cbox .map{margin-block-start:auto;padding-block-start:8px;color:var(--gold2);font-size:14px}
footer{padding:28px max(5vw,16px);color:var(--mute);font-size:14px;text-align:center;border-block-start:1px solid var(--line)}

@media (max-width:980px){nav{display:none}}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);min-height:0;max-height:none}
  .art{max-width:420px;order:-1}
  .two,.cards,.contact,.shelf{grid-template-columns:minmax(0,1fr)}
  .bridge{grid-template-columns:minmax(0,1fr)}
  .rings svg{max-width:180px}
}
@media (max-width:600px){
  :root[dir=rtl] .tl .y{text-align:right}
  .docs{grid-template-columns:minmax(0,1fr)}
  .book{grid-template-columns:minmax(0,1fr)}
  .cover{max-width:190px;justify-self:center;width:100%}
  .tl::before{inset-inline-start:7px}
  .tl li{grid-template-columns:minmax(0,1fr);gap:2px;padding-inline-start:30px}
  .tl li::after{inset-inline-start:1px}
  .tl .y{text-align:left}
  :root[dir=rtl] .tl .y{text-align:right}
}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
function setLang(l){
  const d=T[l]||T.es,root=document.documentElement;
  root.lang=l;root.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>{const v=d[e.dataset.i];if(typeof v==="string")e.textContent=v});
  $("docs").innerHTML=d.docs.map(x=>"<li>"+esc(x)+"</li>").join("");
  $("steps").innerHTML=d.steps.map(s=>"<li><div><h3>"+esc(s[0])+"</h3><p>"+esc(s[1])+"</p></div></li>").join("");
  $("shelf").innerHTML=BOOKS.map((b,i)=>{const x=d.books[i];
    return '<article class="book">'+(b.img?'<img class="cover photo" src="'+b.img+'" alt="'+esc(b.ar)+' — '+esc(b.es)+'">':'<div class="cover '+b.c+'" aria-hidden="true"><div class="ca">'+esc(b.ar)+'</div><div class="cr"></div><div class="ce">'+esc(b.es)+'</div><div class="cn">'+esc(b.au)+'</div></div>')
    +'<div class="binfo"><h3>'+esc(b.es)+'</h3><div class="bar2" lang="ar">'+esc(b.ar)+'</div><div class="au">'+esc(b.au)+'</div>'
    +'<p class="ed">'+esc(x.ed)+'</p>'+(x.meta?'<p class="meta">'+esc(x.meta)+'</p>':'')+'<p class="bn">'+esc(x.n)+'</p>'
    +'<div class="lnks">'+x.l.map((t,j)=>'<a class="lnk" href="'+esc(b.urls[j])+'" target="_blank" rel="noopener">'+esc(t)+'</a>').join("")+'</div></div></article>'}).join("");
  $("cards").innerHTML=d.cards.map((c,i)=>'<article class="card">'+icons[i]+"<h3>"+esc(c[0])+"</h3><p>"+esc(c[1])+'</p><div class="tags">'+c[2].map(t=>"<span>"+esc(t)+"</span>").join("")+"</div></article>").join("");
  $("tl").innerHTML=d.tl.map(r=>'<li><span class="y" dir="ltr">'+esc(r[0]==="*"?d.now:r[0])+'</span><span class="t">'+esc(r[1])+(r[2]?"<small>"+esc(r[2])+"</small>":"")+"</span></li>").join("");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
let start="es";
try{start=localStorage.getItem("lang")||start}catch(e){}
setLang(T[start]?start:"es");
}
